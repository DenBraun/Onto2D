name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install workspace
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run repository checks
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Run validation build
        if: ${{ !cancelled() }}
        run: npm run build
